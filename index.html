<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f13;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 900px;
      background: #1a1a22;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: gray;
    }

    .username {
      font-size: 24px;
      font-weight: bold;
    }

    .bio {
      opacity: 0.7;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: #22222c;
      padding: 15px;
      border-radius: 12px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    iframe {
      width: 100%;
      border-radius: 12px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- PROFILE -->
    <div class="profile">
      <div class="avatar"></div>
      <div>
        <div class="username">Your Name</div>
        <div class="bio">Bio goes here — gaming, coding, music, etc.</div>
      </div>
    </div>

    <!-- CONTENT GRID -->
    <div class="grid">

      <!-- MUSIC PLAYER -->
      <div class="card">
        <h3>Music Player</h3>
        <audio controls>
          <source src="music.mp3" type="audio/mpeg">
          Your browser does not support audio.
        </audio>
        <p style="opacity:0.6; font-size:12px;">Put your music.mp3 in the same folder</p>
      </div>

      <!-- DISCORD STATUS (Widget) -->
      <div class="card">
        <h3>Discord</h3>
        <iframe
          src="https://discord.com/widget?id=YOUR_SERVER_ID&theme=dark"
          height="200"
          allowtransparency="true"
          frameborder="0">
        </iframe>
      </div>

      <!-- SPOTIFY EMBED -->
      <div class="card">
        <h3>Spotify</h3>
        <iframe style="border-radius:12px"
          src="https://open.spotify.com/embed/track/4cOdK2wGLETKBW3PvgPWqT"
          height="152"
          frameborder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>
      </div>

      <!-- LINKS -->
      <div class="card">
        <h3>Links</h3>
        <p><a href="#" style="color:#7aa2ff;">Discord</a></p>
        <p><a href="#" style="color:#7aa2ff;">YouTube</a></p>
        <p><a href="#" style="color:#7aa2ff;">GitHub</a></p>
      </div>

    </div>
  </div>
</body>
</html>
