<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* =========================
   BACKGROUND
========================= */
.bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.55) contrast(1.15) saturate(1.1);
    transform:scale(1.05);
}

/* DARK OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* =========================
   PAGE
========================= */
body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* =========================
   PROFILE CARD
========================= */
.profile{
    width:420px;
    background:rgba(15,15,15,.72);
    backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    box-shadow:0 0 50px rgba(0,0,0,.65);
    overflow:hidden;
}

/* =========================
   AVATAR
========================= */
.avatar-wrapper{
    width:165px;
    height:165px;
    margin:25px auto 10px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.avatar{
    width:165px;
    height:165px;
    object-fit:contain;
    filter:drop-shadow(0 0 18px rgba(255,255,255,.18));
}

/* =========================
   CONTENT
========================= */
.content{
    text-align:center;
    padding:10px 25px 35px;
}

h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:8px;
}

/* USERNAME */
.username{
    display:inline-block;
    font-size:16px;
    color:#ff3b3b;
    text-decoration:none;
    margin-bottom:12px;
    transition:0.2s;
}

.username:hover{
    text-shadow:0 0 12px rgba(255,59,59,.8);
    transform:scale(1.05);
}

/* =========================
   SOCIAL ICONS
========================= */
.socials{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:12px;
}

.socials a img{
    width:34px;
    height:34px;
    object-fit:contain;
    opacity:0.85;
    transition:0.2s;
    filter:drop-shadow(0 0 6px rgba(255,255,255,0.15));
}

.socials a img:hover{
    opacity:1;
    transform:scale(1.2);
    filter:drop-shadow(0 0 10px rgba(255,255,255,0.35));
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<img class="bg"
src="https://i.im.ge/QMitCuW/9c14863b9e64ffc65cdfda4cdc9a0b99_1.gif"
alt="background">

<div class="overlay"></div>

<!-- PROFILE -->
<div class="profile">

    <!-- AVATAR -->
    <div class="avatar-wrapper">
        <img class="avatar"
        src="https://i.im.ge/QMitJ4X/discord_fake_avatar_decorations_1780383216399.gif"
        alt="avatar">
    </div>

    <div class="content">

        <h1>slowspan</h1>

        <a class="username"
           href="https://discord.com/users/YOUR_ID_HERE"
           target="_blank">
            @slowspan.
        </a>

        <!-- SOCIALS -->
        <div class="socials">

            <a href="https://open.spotify.com/user/312ygzuq5botjx3u6sfcck5lm7r4?si=4e6f03cf28344dae" target="_blank">
                <img src="spotify.png" alt="spotify">
            </a>

            <a href="https://steamcommunity.com/profiles/76561198728733895/" target="_blank">
                <img src="aroma.png" alt="steam">
            </a>

            <a href="https://profile.playstation.com/Slowspan" target="_blank">
                <img src="playstation.png" alt="psn">
            </a>

        </div>

    </div>

</div>

</body>
</html>
