<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan Profile</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #0f1f0f, #050505);
}

/* PROFILE CARD */
.card {
    background: rgba(20,20,20,0.85);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    position: relative;
    backdrop-filter: blur(10px);
}

/* AVATAR WRAPPER */
.avatar-container {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 0 auto;
}

/* BASE AVATAR */
.avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    position: relative;
    z-index: 1;
    transition: transform 0.3s ease;
}

/* GIF DECORATION OVERLAY */
.avatar-deco {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 160%;
    height: 160%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 2;
}

/* HOVER EFFECT */
.avatar-container:hover .avatar {
    transform: scale(1.05);
}

/* STATUS DOT */
.status {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 14px;
    height: 14px;
    background: #8a8a8a;
    border-radius: 50%;
    z-index: 3;
    border: 2px solid #111;
}

/* NAME */
.name {
    margin-top: 12px;
    font-size: 20px;
    color: white;
    font-weight: bold;
}

/* DISCORD LINK */
.tag {
    font-size: 14px;
    color: #aaa;
    text-decoration: none;
}

.tag:hover {
    color: #39ff14;
}
</style>

</head>

<body>

<div class="card">

    <div class="avatar-container">

        <!-- YOUR AVATAR (JPG) -->
        <img class="avatar"
             src="https://cdn.corenexis.com/files/c/5249473720.jpg"
             alt="avatar">

        <!-- DECORATION (GIF) -->
        <img class="avatar-deco"
             src="https://cdn.corenexis.com/files/c/3497428720.gif"
             alt="deco">

        <!-- STATUS DOT -->
        <div class="status"></div>

    </div>

    <div class="name">slowspan</div>

    <a class="tag"
       href="https://discord.com/users/slowspan."
       target="_blank">
       slowspan.
    </a>

</div>

</body>
</html>
