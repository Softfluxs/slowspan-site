<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* BACKGROUND */
.bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.55) contrast(1.15) saturate(1.1);
    transform:scale(1.05);
}

/* OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* PAGE */
body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* PROFILE CARD */
.profile{
    width:420px;
    background:rgba(15,15,15,.72);
    backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    box-shadow:0 0 50px rgba(0,0,0,.65);
    overflow:hidden;
}

/* BANNER */
.banner img{
    width:100%;
    height:140px;
    object-fit:cover;
    display:block;
}

/* AVATAR */
.avatar-wrapper{
    width:165px;
    height:165px;
    margin:-75px auto 10px; /* pulls avatar into banner */
    display:flex;
    justify-content:center;
    align-items:center;
}

.avatar{
    width:165px;
    height:165px;
    object-fit:contain;
    border-radius:50%;
    border:4px solid rgba(0,0,0,0.6);
    filter:drop-shadow(0 0 18px rgba(255,255,255,.18));
    background:#111;
}

/* CONTENT */
.content{
    text-align:center;
    padding:10px 25px 35px;
}

h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:8px;
}

/* USERNAME */
.username{
    display:inline-block;
    font-size:16px;
    color:#ff3b3b;
    text-decoration:none;
    margin-bottom:12px;
    transition:0.2s;
}

.username:hover{
    transform:scale(1.05);
    text-shadow:0 0 12px rgba(255,59,59,.8);
}

/* ICON ROW */
.socials{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:12px;
}

/* FONT AWESOME ICONS */
.socials a{
    font-size:34px;
    color:white;
    opacity:0.85;
    transition:0.2s;
    filter:drop-shadow(0 0 6px rgba(255,255,255,0.2));
}

.socials a:hover{
    transform:scale(1.2);
    opacity:1;
    filter:drop-shadow(0 0 12px rgba(255,255,255,0.6));
}

.fa-steam:hover{ color:#66c0f4; }
.fa-playstation:hover{ color:#0070d1; }
.fa-spotify:hover{ color:#1db954; }
</style>
</head>

<body>

<!-- BACKGROUND -->
<img class="bg"
src="https://i.im.ge/QMitCuW/9c14863b9e64ffc65cdfda4cdc9a0b99_1.gif">

<div class="overlay"></div>

<!-- PROFILE -->
<div class="profile">

    <!-- BANNER -->
    <div class="banner">
        <img src="https://i.im.ge/QMiy7oT/24baee95217b413d6a9512f0309831b8_1.gif">
    </div>

    <!-- AVATAR -->
    <div class="avatar-wrapper">
        <img class="avatar"
        src="https://i.im.ge/QMitJ4X/discord_fake_avatar_decorations_1780383216399.gif">
    </div>

    <div class="content">

        <h1>slowspan</h1>

        <a class="username"
           href="https://discord.com/users/YOUR_ID_HERE"
           target="_blank">
            @slowspan.
        </a>

        <!-- SOCIALS -->
        <div class="socials">

            <a href="https://open.spotify.com/user/312ygzuq5botjx3u6sfcck5lm7r4" target="_blank">
                <i class="fa-brands fa-spotify"></i>
            </a>

            <a href="https://steamcommunity.com/profiles/76561198728733895" target="_blank">
                <i class="fa-brands fa-steam"></i>
            </a>

            <a href="https://profile.playstation.com/Slowspan" target="_blank">
                <i class="fa-brands fa-playstation"></i>
            </a>

        </div>

    </div>

</div>

</body>
</html>
