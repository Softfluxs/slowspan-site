<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* BACKGROUND */
.bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.55) contrast(1.15) saturate(1.1);
    transform:scale(1.05);
}

/* OVERLAY */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* PAGE */
body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* ENTER SCREEN */
.enter-screen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(18px);
}

.enter-symbol{
    font-size:140px;
    font-weight:800;
    color:white;
    cursor:pointer;
    animation:pulseGlow 2.5s infinite ease-in-out;
    text-shadow:0 0 25px rgba(255,255,255,0.2);
}

@keyframes pulseGlow{
    0%{opacity:0.7; transform:scale(1);}
    50%{opacity:1; transform:scale(1.05);}
    100%{opacity:0.7; transform:scale(1);}
}

/* PROFILE */
.profile{
    width:420px;
    background:rgba(15,15,15,.72);
    backdrop-filter:blur(22px);
    border-radius:24px;
    border:1px solid rgba(255,255,255,.06);
    overflow:hidden;

    opacity:0;
    transform:translateY(20px);
    transition:1s ease;

    animation:borderGlow 4s ease-in-out infinite;
}

.profile.show{
    opacity:1;
    transform:translateY(0);
}

/* GREY GLOW BORDER */
@keyframes borderGlow{
    0%{
        box-shadow:0 0 10px rgba(120,120,120,0.05),0 0 20px rgba(120,120,120,0.08);
    }
    50%{
        box-shadow:0 0 25px rgba(170,170,170,0.12),0 0 45px rgba(140,140,140,0.1);
    }
    100%{
        box-shadow:0 0 10px rgba(120,120,120,0.05),0 0 20px rgba(120,120,120,0.08);
    }
}

/* BANNER */
.banner img{
    width:100%;
    height:140px;
    object-fit:cover;
    display:block;
}

/* MUSIC */
.music-card{
    width:85%;
    margin:12px auto;
    padding:10px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;
}

.music-info .title{
    font-size:13px;
    font-weight:600;
}

.music-info .sub{
    font-size:11px;
    opacity:0.7;
}

.music-toggle{
    width:34px;
    height:34px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(0,0,0,0.25);
    color:white;
    cursor:pointer;
}

/* AVATAR */
.avatar-wrapper{
    width:165px;
    height:165px;
    margin:10px auto;
    position:relative;
}

.avatar{
    width:165px;
    height:165px;
    object-fit:cover;
    border-radius:50%;
}

/* DISCORD DOT (OVERLAPPING EDGE) */
.status-dot{
    position:absolute;
    bottom:10px;
    right:10px;

    width:18px;
    height:18px;
    border-radius:50%;

    background:#747f8d;
    border:3px solid rgba(15,15,15,0.95);

    transform:translate(35%,35%);
}

/* CONTENT */
.content{
    text-align:center;
    padding:10px 25px 35px;
}

/* ANIMATED TITLE */
.animated-title{
    font-size:30px;
    font-weight:700;
    display:flex;
    justify-content:center;
    gap:2px;
}

.animated-title span{
    opacity:0;
    transform:translateY(10px);
    animation:letterFade 2.5s infinite;
}

@keyframes letterFade{
    0%{opacity:0; transform:translateY(10px);}
    20%{opacity:1; transform:translateY(0);}
    60%{opacity:1;}
    100%{opacity:0; transform:translateY(-10px);}
}

/* SOCIALS */
.socials{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:12px;
}

.socials a{
    font-size:34px;
    color:white;
    opacity:0.85;
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<img class="bg" src="https://i.im.ge/QMitCuW/9c14863b9e64ffc65cdfda4cdc9a0b99_1.gif">
<div class="overlay"></div>

<!-- AUDIO -->
<audio id="bg-audio" loop>
  <source src="https://videotourl.com/audio/1780387263434-fd66ba40-2bfa-4b32-afc5-a312db49cb96.mp3">
</audio>

<!-- ENTER SCREEN -->
<div class="enter-screen" onclick="enterSite()">
    <div class="enter-symbol">S</div>
</div>

<!-- PROFILE -->
<div class="profile" id="profile">

    <div class="banner">
        <img src="https://i.im.ge/QMiy7oT/24baee95217b413d6a9512f0309831b8_1.gif">
    </div>

    <!-- MUSIC -->
    <div class="music-card">
        <div class="music-info">
            <div class="title">See You Again</div>
            <div class="sub">slowspan</div>
        </div>

        <button class="music-toggle" id="btn" onclick="toggleMusic()">▶</button>
    </div>

    <!-- AVATAR -->
    <div class="avatar-wrapper">
        <img class="avatar"
        src="https://i.im.ge/QMiyfHf/discord_fake_avatar_decorations_1780383216399.gif">

        <div class="status-dot"></div>
    </div>

    <div class="content">
        <h1 class="animated-title"></h1>

        <a class="username">@slowspan.</a>

        <div class="socials">
            <a href="#"><i class="fa-brands fa-spotify"></i></a>
            <a href="#"><i class="fa-brands fa-steam"></i></a>
            <a href="#"><i class="fa-brands fa-playstation"></i></a>
        </div>
    </div>

</div>

<script>
const audio = document.getElementById("bg-audio");
const profile = document.getElementById("profile");
const btn = document.getElementById("btn");

function enterSite(){
    document.querySelector(".enter-screen").style.display = "none";
    audio.volume = 0.5;
    audio.play();
    profile.classList.add("show");
}

function toggleMusic(){
    if(audio.paused){
        audio.play();
        btn.textContent = "❚❚";
    } else {
        audio.pause();
        btn.textContent = "▶";
    }
}

/* TITLE ANIMATION */
const name = "slowspan";
const title = document.querySelector(".animated-title");

[...name].forEach((char, i) => {
    const span = document.createElement("span");
    span.textContent = char;
    span.style.animationDelay = (i * 0.12) + "s";
    title.appendChild(span);
});
</script>

</body>
</html>
