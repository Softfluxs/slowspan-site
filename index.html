<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* =========================
   BACKGROUND VIDEO
========================= */
.bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

/* fallback image background */
.bg-fallback{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:url("fallback.jpg") center/cover no-repeat;
    z-index:-4;
}

/* dark overlay */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* =========================
   PAGE
========================= */
body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* =========================
   PROFILE CARD
========================= */
.profile{
    width:420px;
    background:rgba(15,15,15,.75);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    box-shadow:0 0 40px rgba(0,0,0,.6);
    overflow:hidden;
}

/* banner */
.banner{
    height:130px;
    background:rgba(255,255,255,0.03);
}

/* avatar */
.avatar-wrapper{
    width:160px;
    height:160px;
    margin:-80px auto 10px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.avatar{
    width:160px;
    height:160px;
    object-fit:contain;
    filter:drop-shadow(0 0 15px rgba(255,255,255,.15));
}

/* =========================
   CONTENT
========================= */
.content{
    text-align:center;
    padding:10px 25px 30px;
}

h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:6px;
}

/* username */
.username{
    display:inline-block;
    font-size:16px;
    color:#ff2b2b;
    text-decoration:none;
    margin-bottom:15px;
    transition:0.2s;
}

.username:hover{
    text-shadow:0 0 10px rgba(255,43,43,.8);
}

/* bio */
.bio{
    font-size:14px;
    color:#b5b5b5;
    line-height:1.6;
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:500px){
    .profile{
        width:90%;
    }
}
</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<video class="bg-video" autoplay muted loop playsinline>
    <source src="canyons.mp4" type="video/mp4">
</video>

<!-- FALLBACK IMAGE (shows if video fails) -->
<div class="bg-fallback"></div>

<!-- DARK OVERLAY -->
<div class="overlay"></div>

<!-- PROFILE CARD -->
<div class="profile">

    <div class="banner"></div>

    <div class="avatar-wrapper">
        <img class="avatar"
        src="https://i.im.ge/QMiP57x/discord_fake_avatar_decorations_1780377375443.gif"
        alt="avatar">
    </div>

    <div class="content">

        <h1>slowspan</h1>

        <a class="username"
           href="https://discord.com/users/YOUR_ID_HERE"
           target="_blank">
            @slowspan.
        </a>

        <p class="bio">
            welcome to my profile.
        </p>

    </div>

</div>

</body>
</html>
