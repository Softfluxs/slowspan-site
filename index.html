<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* BACKGROUND */
.bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.55) contrast(1.15) saturate(1.1);
    transform:scale(1.05);
}

/* OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* PAGE */
body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* PROFILE */
.profile{
    width:420px;
    background:rgba(15,15,15,.72);
    backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    box-shadow:0 0 50px rgba(0,0,0,.65);
    overflow:hidden;
}

/* AVATAR */
.avatar-wrapper{
    width:165px;
    height:165px;
    margin:25px auto 10px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.avatar{
    width:165px;
    height:165px;
    object-fit:contain;
    filter:drop-shadow(0 0 18px rgba(255,255,255,.18));
}

/* CONTENT */
.content{
    text-align:center;
    padding:10px 25px 35px;
}

h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:8px;
}

/* USERNAME */
.username{
    display:inline-block;
    font-size:16px;
    color:#ff3b3b;
    text-decoration:none;
    margin-bottom:12px;
    transition:0.2s;
}

.username:hover{
    text-shadow:0 0 12px rgba(255,59,59,.8);
    transform:scale(1.05);
}

/* SOCIALS */
.socials{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:12px;
}

/* SVG ICONS */
.icon svg{
    width:34px;
    height:34px;
    fill:white;
    opacity:0.85;
    transition:0.2s;
    filter:drop-shadow(0 0 6px rgba(255,255,255,0.15));
}

.icon:hover svg{
    transform:scale(1.25);
    fill:#ff3b3b;
    opacity:1;
    filter:drop-shadow(0 0 10px rgba(255,59,59,0.5));
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<img class="bg"
src="https://i.im.ge/QMitCuW/9c14863b9e64ffc65cdfda4cdc9a0b99_1.gif"
alt="background">

<div class="overlay"></div>

<!-- PROFILE -->
<div class="profile">

    <!-- AVATAR -->
    <div class="avatar-wrapper">
        <img class="avatar"
        src="https://i.im.ge/QMitJ4X/discord_fake_avatar_decorations_1780383216399.gif"
        alt="avatar">
    </div>

    <div class="content">

        <h1>slowspan</h1>

        <a class="username"
           href="https://discord.com/users/YOUR_ID_HERE"
           target="_blank">
            @slowspan.
        </a>

        <!-- SOCIALS -->
        <div class="socials">

            <!-- SPOTIFY -->
            <a href="https://open.spotify.com/user/312ygzuq5botjx3u6sfcck5lm7r4?si=4e6f03cf28344dae" target="_blank" class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 17.3c-.2.3-.6.4-.9.2-2.5-1.5-5.6-1.8-9.2-.9-.4.1-.7-.2-.8-.5-.1-.4.2-.7.5-.8 3.9-.9 7.3-.5 10.1 1.1.3.2.4.6.3.9zm1.2-2.7c-.3.4-.8.5-1.2.3-2.9-1.7-7.3-2.2-10.7-1.1-.5.1-1-.1-1.1-.6-.2-.5.1-1 .6-1.1 4-1.2 8.8-.6 12.2 1.3.4.2.5.7.2 1.2zm.1-2.9c-3.6-2.1-9.5-2.3-12.9-1.2-.6.2-1.2-.2-1.4-.8-.2-.6.2-1.2.8-1.4 4-1.2 10.5-1 14.7 1.4.5.3.7 1 .4 1.5-.3.5-1 .7-1.6.5z"/>
                </svg>
            </a>

            <!-- STEAM -->
            <a href="https://steamcommunity.com/profiles/76561198728733895/" target="_blank" class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0a12 12 0 00-4.2 23.2l3.2-3a3.5 3.5 0 114.8-4.8l3-3.2A12 12 0 0012 0zm-1.5 15a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
            </a>

            <!-- PLAYSTATION -->
            <a href="https://profile.playstation.com/Slowspan" target="_blank" class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M4 17c2-1 5-1 7 0l-2 1c-1-.5-3-.5-5 0v-1zm16-10c-2-1-5-1-7 0l2 1c1-.5 3-.5 5 0V7zM12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/>
                </svg>
            </a>

        </div>

    </div>

</div>

</body>
</html>
