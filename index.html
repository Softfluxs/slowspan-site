<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* BACKGROUND */
.bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.55) contrast(1.15) saturate(1.1);
    transform:scale(1.05);
}

/* OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* PAGE */
body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* PROFILE */
.profile{
    width:420px;
    background:rgba(15,15,15,.72);
    backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    box-shadow:0 0 50px rgba(0,0,0,.65);
    overflow:hidden;
}

/* AVATAR */
.avatar-wrapper{
    width:165px;
    height:165px;
    margin:25px auto 10px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.avatar{
    width:165px;
    height:165px;
    object-fit:contain;
    filter:drop-shadow(0 0 18px rgba(255,255,255,.18));
}

/* CONTENT */
.content{
    text-align:center;
    padding:10px 25px 35px;
}

h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:8px;
}

/* USERNAME */
.username{
    display:inline-block;
    font-size:16px;
    color:#ff3b3b;
    text-decoration:none;
    margin-bottom:12px;
    transition:0.2s;
}

.username:hover{
    text-shadow:0 0 12px rgba(255,59,59,.8);
    transform:scale(1.05);
}

/* SOCIALS */
.socials{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-top:12px;
}

/* ICON STYLE */
.icon svg{
    width:34px;
    height:34px;
    fill:white;
    opacity:0.8;
    transition:0.2s;
    filter:drop-shadow(0 0 6px rgba(255,255,255,0.2));
}

/* HOVER EFFECT */
.icon:hover svg{
    transform:scale(1.25);
    opacity:1;
    filter:drop-shadow(0 0 12px rgba(255,255,255,0.5));
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<img class="bg"
src="https://i.im.ge/QMitCuW/9c14863b9e64ffc65cdfda4cdc9a0b99_1.gif">

<div class="overlay"></div>

<!-- PROFILE -->
<div class="profile">

    <!-- AVATAR -->
    <div class="avatar-wrapper">
        <img class="avatar"
        src="https://i.im.ge/QMitJ4X/discord_fake_avatar_decorations_1780383216399.gif">
    </div>

    <div class="content">

        <h1>slowspan</h1>

        <a class="username"
           href="https://discord.com/users/YOUR_ID_HERE"
           target="_blank">
            @slowspan.
        </a>

        <!-- SOCIALS -->
        <div class="socials">

            <!-- SPOTIFY -->
            <a href="https://open.spotify.com/user/312ygzuq5botjx3u6sfcck5lm7r4?si=4e6f03cf28344dae" target="_blank" class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 17.3c-.2.3-.6.4-.9.2-2.5-1.5-5.6-1.8-9.2-.9-.4.1-.7-.2-.8-.5-.1-.4.2-.7.5-.8 3.9-.9 7.3-.5 10.1 1.1.3.2.4.6.3.9z"/>
                </svg>
            </a>

            <!-- STEAM -->
            <a href="https://steamcommunity.com/profiles/76561198728733895/" target="_blank" class="icon">
                <svg viewBox="0 0 512 512">
                    <path d="M18 18v31.758C38.244 53.855 59.076 55.953 80 56a318 318 0 0 0 50.658-4.27C143.375 100.622 200.964 135.96 268 136c15.1-.044 30.093-1.903 44.395-5.504c3.702 25.632 27.322 44.78 55.275 44.813c4.215 14.473 20.33 24.72 38.906 24.738c22.09 0 40-14.327 40-32c-.022-13.555-10.718-25.63-26.697-30.137z"/>
                </svg>
            </a>

            <!-- PLAYSTATION -->
            <a href="https://profile.playstation.com/Slowspan" target="_blank" class="icon">
                <svg viewBox="0 0 8 8">
                    <path d="M2 6v1q-4 0 0-3v1L1 6m4 1l1-1H5V5q4 0 0 3M4 8L3 7V0q5 0 2 4V2L4 1"/>
                </svg>
            </a>

        </div>

    </div>

</div>

</body>
</html>
