<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* NEW BACKGROUND (was banner before) */
.bg-gif{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

/* DARK OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* PAGE */
body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* PROFILE CARD */
.profile{
    width:420px;
    background:rgba(15,15,15,.75);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    box-shadow:0 0 40px rgba(0,0,0,.6);
    overflow:hidden;
}

/* NEW BANNER (was background before) */
.banner{
    height:140px;
    background:url("https://i.im.ge/QMiP3C8/9f5acaae03db8cd6b3fc0f608c07ae0b_1.gif") center/cover no-repeat;
}

/* AVATAR */
.avatar-wrapper{
    width:160px;
    height:160px;
    margin:-80px auto 10px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.avatar{
    width:160px;
    height:160px;
    object-fit:contain;
    filter:drop-shadow(0 0 15px rgba(255,255,255,.15));
}

/* CONTENT */
.content{
    text-align:center;
    padding:10px 25px 30px;
}

h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:6px;
}

/* USERNAME */
.username{
    display:inline-block;
    font-size:16px;
    color:#ff2b2b;
    text-decoration:none;
    margin-bottom:15px;
    transition:0.2s;
}

.username:hover{
    text-shadow:0 0 10px rgba(255,43,43,.8);
}

/* BIO */
.bio{
    font-size:14px;
    color:#b5b5b5;
    line-height:1.6;
}
</style>
</head>

<body>

<!-- NEW BACKGROUND -->
<img class="bg-gif"
src="https://i.im.ge/QMitxRT/a8d51b3626ab1832e180770eb4de9ec2.gif"
alt="background">

<div class="overlay"></div>

<div class="profile">

    <!-- SWAPPED BANNER -->
    <div class="banner"></div>

    <div class="avatar-wrapper">
        <img class="avatar"
        src="https://i.im.ge/QMiP57x/discord_fake_avatar_decorations_1780377375443.gif"
        alt="avatar">
    </div>

    <div class="content">

        <h1>slowspan</h1>

        <a class="username"
           href="https://discord.com/users/YOUR_ID_HERE"
           target="_blank">
            @slowspan.
        </a>

        <p class="bio">
            welcome to my profile.
        </p>

    </div>

</div>

</body>
</html>
