<!doctype html>

<title>slowspan</title>
<style>
:root{color-scheme:dark;--ice:#dbeefa;--muted:#a6bdcf;--gold:#ffdba3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}body{color:var(--ice);background:#071422;overflow-x:hidden}
.background-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-4;filter:brightness(.68) saturate(.85);pointer-events:none}
.video-shade{position:fixed;inset:0;z-index:-3;background:linear-gradient(180deg,#04111c65,#06132280);pointer-events:none}
body:has(.background-video) .scene{background:transparent}
body:has(.background-video) .scene .moon,body:has(.background-video) .scene .stars,body:has(.background-video) .scene .trees,body:has(.background-video) .scene .hills{opacity:0}
.scene{position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse at 50% 5%,#294661 0%,#10253b 43%,#06111e 100%)}
.moon{position:absolute;top:9%;right:17%;width:105px;aspect-ratio:1;border-radius:50%;background:#e7f4ff;box-shadow:0 0 35px #c6e8ff80,0 0 130px #a5d4ff4a}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 8% 12%,#fff 99%,transparent),radial-gradient(2px 2px at 28% 30%,#fff9 99%,transparent),radial-gradient(1px 1px at 73% 18%,#fff 99%,transparent),radial-gradient(2px 2px at 91% 38%,#fff9 99%,transparent);background-size:340px 260px;opacity:.7}
.hills{position:absolute;bottom:-10vh;left:-10%;width:120%;height:32vh;background:linear-gradient(#b6d4e5,#789bb7);border-radius:50% 50% 0 0/80% 80% 0 0;filter:brightness(.55)}
.trees{position:absolute;bottom:11vh;left:0;width:100%;height:31vh;opacity:.7;background:linear-gradient(150deg,transparent 45%,#071c23 45% 55%,transparent 55%) 0 0/110px 100%,linear-gradient(210deg,transparent 45%,#071c23 45% 55%,transparent 55%) 0 0/110px 100%;clip-path:polygon(0 100%,0 45%,5% 10%,10% 65%,15% 18%,20% 67%,25% 4%,31% 73%,36% 25%,41% 65%,47% 10%,52% 72%,59% 16%,65% 70%,71% 8%,77% 66%,83% 19%,90% 65%,96% 8%,100% 55%,100% 100%)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
main{position:relative;min-height:100svh;display:grid;place-items:center;padding:70px 20px;isolation:isolate}
.profile{width:min(100%,440px);text-align:center;padding:42px 32px 34px;border:1px solid #e0f3ff12;border-radius:28px;background:linear-gradient(140deg,#19354c70,#0b192a85);box-shadow:0 25px 85px #0005,inset 0 1px #ffffff12;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);position:relative;overflow:hidden}
.lights{position:absolute;top:0;left:0;right:0;height:35px;display:flex;justify-content:space-around;border-top:0;border-radius:0}
.bulb{width:9px;height:14px;border-radius:50% 50% 55% 55%;background:var(--c);box-shadow:0 0 12px 3px var(--c);transform:translateY(8px);animation:twinkle 2.6s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes twinkle{to{opacity:.4;filter:brightness(.7)}}.avatar{margin:12px auto 17px;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font-size:43px;font-weight:750;background:linear-gradient(145deg,#527b95,#182f46);border:3px solid #e0f4ffb3;box-shadow:0 0 0 6px #e2f4ff15,0 12px 35px #0006}
.eyebrow{text-transform:uppercase;letter-spacing:.25em;font-size:11px;font-weight:700;color:var(--gold)}h1{font-size:clamp(32px,7vw,43px);letter-spacing:-.05em;margin:9px 0 6px}p{color:var(--muted);line-height:1.65;margin:0 auto 24px;max-width:310px}.status{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid #c7e5fa33;border-radius:99px;font-size:12px;color:#cce6f5;margin-bottom:24px}.dot{width:7px;height:7px;border-radius:50%;background:#a5e7c5;box-shadow:0 0 9px #a5e7c5}
.links{display:grid;gap:11px}.links a{display:flex;justify-content:center;align-items:center;min-height:49px;text-decoration:none;color:#edf7ff;font-weight:650;background:#d8f0ff12;border:1px solid #d8f0ff38;border-radius:13px;transition:transform .2s,background .2s,border-color .2s}.links a:hover,.links a:focus-visible{transform:translateY(-2px);background:#d8f0ff25;border-color:#e6f5ff99;outline:none}
.music-player{width:min(100%,285px);margin:0 auto 18px;padding:11px 13px;text-align:left;border:1px solid #d8f0ff36;border-radius:18px;background:#d8f0ff0c;box-shadow:inset 0 1px #ffffff14}
.music-heading{display:flex;align-items:center;gap:9px;margin-bottom:0}
.music-art{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,#3d6e7a,#153449);font-size:19px}
.music-details{min-width:0;flex:1}.music-details strong{display:block;font-size:13px;color:#f1f9ff}.music-details small{font-size:10px;color:#a8c4d6}
.music-toggle{width:38px;height:38px;flex:none;border:1px solid #d8f0ff55;border-radius:50%;background:#e3f4ff;color:#11263b;font-size:18px;cursor:pointer}
.music-progress{width:100%;height:5px;accent-color:#d9f2ff;cursor:pointer}
.music-meta{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:8px;color:#b2cbd9;font-size:11px}
.music-volume{width:77px;accent-color:#d9f2ff}.music-notice{font-size:11px;color:#ffe1a9;margin:8px 0 0;line-height:1.4}
footer{font-size:12px;color:#a7c1d2;margin-top:26px}footer span{color:#ffe2ac}
@media(max-width:480px){.profile{padding:36px 23px 27px}.moon{right:9%;width:70px}}
@media(prefers-reduced-motion:reduce){.background-video{display:none}.scene{background:radial-gradient(ellipse at 50% 5%,#294661 0%,#10253b 43%,#06111e 100%)!important}.scene .moon,.scene .stars,.scene .trees,.scene .hills{opacity:1!important}*,*:before,*:after{animation:none!important;transition:none!important}}


/* Animated profile identity, with graceful fallback until the photo is uploaded. */
.avatar{overflow:hidden;position:relative;animation:avatar-arrive .85s cubic-bezier(.2,.8,.2,1) both,avatar-float 5s ease-in-out 1s infinite;transition:box-shadow .3s,transform .3s}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;border-radius:50%}
.avatar-initial{display:none}.avatar.avatar-fallback .avatar-initial{display:block}
.avatar:hover{box-shadow:0 0 0 7px #e2f4ff22,0 0 38px #c2eaff77;transform:translateY(-4px)}
.profile h1{display:inline-block;white-space:nowrap;background:linear-gradient(105deg,#e5f6ff 15%,#91c9ed 38%,#fff 52%,#a7d7f3 72%,#e5f6ff 90%);background-size:230% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:name-arrive .9s ease-out both,name-shimmer 6s linear 1s infinite}
@keyframes avatar-arrive{from{opacity:0;transform:translateY(20px) scale(.78)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes avatar-float{0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes name-arrive{from{opacity:0;transform:translateY(12px);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes name-shimmer{to{background-position:230% center}}
@media(prefers-reduced-motion:reduce){.avatar,.profile h1{animation:none!important}}
.profile h1 .moving-letter{display:inline-block;position:relative;will-change:transform;animation:letter-wave 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * -.15s)}
@keyframes letter-wave{0%,100%{transform:translate3d(0,0,0)}25%{transform:translate3d(0,-5px,0)}50%{transform:translate3d(0,0,0)}75%{transform:translate3d(0,3px,0)}}
@media(prefers-reduced-motion:reduce){.profile h1 .moving-letter{animation:none!important}}
/* Keep the username on its own row and paint each animated glyph independently. */
.profile h1{display:block;width:100%;max-width:100%;margin:12px auto 12px;line-height:1.35;white-space:nowrap;background:none!important;background-clip:border-box!important;-webkit-background-clip:border-box!important;color:#eaf6ff!important;animation:name-arrive .9s ease-out both!important;overflow:visible}
.profile h1 .moving-letter{display:inline-block;vertical-align:baseline;color:#eaf6ff!important;-webkit-text-fill-color:#eaf6ff;background:none!important;text-shadow:0 1px 12px #9fd4f344;animation:letter-wave 3.6s ease-in-out infinite!important;animation-delay:calc(var(--i) * -.16s)!important}
.profile .status{display:flex;width:max-content;max-width:100%;justify-content:center;margin:0 auto 24px;clear:both}
@media(max-width:380px){.profile h1{font-size:clamp(29px,8vw,38px)}}
@media(prefers-reduced-motion:reduce){.profile h1,.profile h1 .moving-letter{animation:none!important}}
/* Accessible, cinematic Slowspan entrance */
.entrance{outline:none!important;-webkit-tap-highlight-color:transparent;appearance:none;-webkit-appearance:none;position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;background:#071422;transition:opacity .8s ease,visibility .8s ease}
.entrance:focus,.entrance:focus-visible{outline:none!important;box-shadow:none!important;border:0!important}
.entrance-inner{position:relative;text-align:center;animation:entrance-rise 1.3s cubic-bezier(.2,.8,.2,1) both}
.entrance-monogram{font-family:Georgia,serif;font-size:clamp(110px,30vw,190px);font-weight:700;line-height:1;color:#e9f8ff;text-shadow:none;animation:none}
.entrance-subtitle{margin-top:14px;color:#a7c4d8;letter-spacing:.12em;font-size:11px}
.entrance.dismissed{opacity:0;visibility:hidden;pointer-events:none}
@keyframes entrance-rise{from{opacity:0;transform:translateY(30px) scale(.86);filter:blur(9px)}to{opacity:1;transform:none;filter:blur(0)}}
@media(prefers-reduced-motion:reduce){.entrance-inner,.entrance-spark,.entrance-monogram{animation:none!important}}

/* Small winter snowman perched beside the animated username. */
.profile h1{position:relative;display:flex!important;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.profile h1 .username-snowman{display:inline-flex;flex:none;width:31px;height:44px;align-items:flex-end;transform-origin:center bottom;animation:snowman-wobble 5s ease-in-out infinite}
.username-snowman svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 2px #0004)}
@keyframes snowman-wobble{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}
@media(max-width:380px){.profile h1{gap:3px}.profile h1 .username-snowman{width:25px;height:37px}}
@media(prefers-reduced-motion:reduce){.profile h1 .username-snowman{animation:none}}
</style>

<body>
<button class="entrance" id="entrance" type="button" aria-label="Enter website and play music" style="border:0;width:100%;padding:0;color:inherit;cursor:pointer;font:inherit">
<span class="entrance-inner"><span class="entrance-monogram" aria-hidden="true" style="display:block">S</span><span class="entrance-subtitle" style="display:block">A little corner of winter</span></span>
</button>
<video class="background-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true" poster=""><source src="assets/slowspan-winter-background.mp4" type="video/mp4"></video><div class="video-shade" aria-hidden="true"></div>
<div class="scene" aria-hidden="true"><div class="stars"></div><div class="moon"></div><div class="trees"></div><div class="hills"></div></div>
<canvas id="snow" aria-hidden="true"></canvas>
<main><section class="profile" aria-label="Personal profile">


<div class="avatar" aria-label="Slowspan profile picture"><img src="assets/9073a5a464bc74ceed351f31deb38de2%20(1).jpg" alt="Orange cat wearing a Santa hat and holding a mug" loading="eager" decoding="async" onerror="this.hidden=true;this.parentElement.classList.add('avatar-fallback')"><span class="avatar-initial" aria-hidden="true">S</span></div>
<div class="eyebrow">A little corner of winter</div><h1 aria-label="Slowspan"><span aria-hidden="true" class="moving-letter" style="--i:0">S</span><span aria-hidden="true" class="moving-letter" style="--i:1">l</span><span aria-hidden="true" class="moving-letter" style="--i:2">o</span><span aria-hidden="true" class="moving-letter" style="--i:3">w</span><span aria-hidden="true" class="moving-letter" style="--i:4">s</span><span aria-hidden="true" class="moving-letter" style="--i:5">p</span><span aria-hidden="true" class="moving-letter" style="--i:6">a</span><span aria-hidden="true" class="moving-letter" style="--i:7">n</span><span class="username-snowman" aria-hidden="true"><svg viewBox="0 0 50 70" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="snowman-body" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b7d8e9"/></linearGradient></defs><ellipse cx="25" cy="66" rx="19" ry="3" fill="#a8c7dd" opacity=".2"/><circle cx="25" cy="48" r="16" fill="url(#snowman-body)" stroke="#d5e7ef" stroke-width="1"/><circle cx="25" cy="26" r="12" fill="url(#snowman-body)" stroke="#d5e7ef" stroke-width="1"/><path d="M17 15 L17 5 L33 5 L33 15 Z" fill="#263948"/><path d="M12 16 L38 16" stroke="#263948" stroke-width="4" stroke-linecap="round"/><path d="M16 34 Q25 40 35 34" fill="none" stroke="#a93e47" stroke-width="5" stroke-linecap="round"/><path d="M34 35 L38 45" stroke="#a93e47" stroke-width="4" stroke-linecap="round"/><circle cx="21" cy="25" r="1.6" fill="#253a4a"/><circle cx="29" cy="25" r="1.6" fill="#253a4a"/><path d="M25 28 L36 31 L25 32Z" fill="#e99347"/><circle cx="25" cy="44" r="1.7" fill="#49606a"/><circle cx="25" cy="51" r="1.7" fill="#49606a"/><path d="M11 44 L3 37 M39 44 L47 37" stroke="#806047" stroke-width="2.3" stroke-linecap="round"/></svg></span></h1>
<div class="status"><span class="dot"></span>Enjoying winter nights</div>
<section class="music-player" aria-label="Christmas music player">
<audio id="holiday-audio" preload="metadata" loop src="assets/Single%20Last%20Christmas.mp3"></audio>
<div class="music-heading"><div class="music-art" aria-hidden="true"><svg viewBox="0 0 32 36" width="25" height="29" xmlns="http://www.w3.org/2000/svg"><path d="M11 4H25V19C25 24 20 25 15 28L10 31C6 33 2 30 2 26C2 23 4 21 7 20L11 18Z" fill="#bb3842" stroke="#862831" stroke-width="1.2"/><path d="M9 3Q9 1 11 1H25Q27 1 27 3V9Q27 11 25 11H11Q9 11 9 9Z" fill="#f4f3eb" stroke="#d4dce0" stroke-width=".8"/><path d="M11 12V18Q10 21 7 23" fill="none" stroke="#e47d7b" stroke-width="1.2" opacity=".65"/><path d="M5 25Q9 27 12 30" fill="none" stroke="#f2b8a5" stroke-width="1.6" opacity=".55"/><path d="M17 16L19 18L23 14" fill="none" stroke="#f0c68d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="music-details"><strong>Last Christmas</strong><small>Holiday soundtrack</small></div>
<button class="music-toggle" id="music-toggle" type="button" aria-label="Play music">▶</button></div>
<p class="music-notice" id="music-notice" hidden>Tap play to start the music — your browser blocks automatic sound.</p>
</section>
</section></main>
<script>
(()=>{
const canvas=document.getElementById('snow'),ctx=canvas.getContext('2d',{alpha:true});if(!ctx)return;
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let w=0,h=0,dpr=1,flakes=[],raf=0,last=0,gust=0,gustTarget=0,gustClock=0,windTime=0;
const rand=(a,b)=>a+Math.random()*(b-a);
function flake(initial=false){
 const depth=Math.pow(Math.random(),1.55);
 const radius=.55+depth*3.0;
 return {x:rand(-45,w+45),y:initial?rand(-30,h+30):rand(-95,-5),
   depth,radius,vy:13+depth*70+rand(-5,8),drift:rand(-7,7),phase:rand(0,Math.PI*2),
   flutter:rand(1.5,8),opacity:.27+depth*.68,spin:rand(-.5,.5),
   angle:rand(0,Math.PI*2),kind:Math.random()<.21&&depth>.55?'crystal':'flake'};
}
function resize(){
 w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
 const target=Math.min(320,Math.max(85,Math.round(w*h/3300)));
 flakes=Array.from({length:target},()=>flake(true));
}
function crystal(f){
 const size=2.1+f.depth*3.7;
 ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.angle);
 ctx.lineWidth=.7;ctx.strokeStyle='#f5fbff';ctx.shadowColor='#c6eaff';ctx.shadowBlur=2.2;ctx.beginPath();
 for(let i=0;i<6;i++){
  const a=i*Math.PI/3;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*size,Math.sin(a)*size);
  const x=Math.cos(a)*size*.64,y=Math.sin(a)*size*.64;
  for(const side of [-1,1]){const theta=a+side*.55;ctx.moveTo(x,y);ctx.lineTo(x-Math.cos(theta)*size*.25,y-Math.sin(theta)*size*.25);}
 }
 ctx.stroke();ctx.restore();
}
function draw(time){
 const dt=Math.min((time-last)/1000||.016,.045);last=time;windTime+=dt;gustClock-=dt;
 if(gustClock<=0){gustTarget=Math.random()<.22?rand(-105,-45):rand(28,125);gustClock=rand(3.8,8.5);}
 gust+=(gustTarget-gust)*Math.min(1,dt*.48);
 const wind=gust+Math.sin(windTime*.85)*9+Math.sin(windTime*.29)*14;
 ctx.clearRect(0,0,w,h);
 for(let i=0;i<flakes.length;i++){
  const f=flakes[i],layer=.22+f.depth*1.45;
  const turbulence=Math.sin(windTime*(1.1+f.depth)+f.phase)*f.flutter;
  const vx=(wind*layer+f.drift+turbulence);
  const vy=f.vy*(1-.16*Math.min(1,Math.abs(wind)/120));
  f.x+=vx*dt;f.y+=vy*dt;f.angle+=f.spin*dt;
  if(f.y>h+18||f.x>w+70||f.x< -70){
   flakes[i]=flake();
   // During strong gusts, enter from the windward edge, at varied heights.
   if(Math.abs(wind)>40&&Math.random()<.65){flakes[i].x=wind>0?-20:w+20;flakes[i].y=rand(-20,h*.85);}
   continue;
  }
  ctx.globalAlpha=f.opacity;ctx.shadowBlur=0;
  if(f.kind==='crystal'){crystal(f);continue;}
  if(f.depth>.82){
   // Nearby flakes stretch slightly in the direction of a gust: snow, not glowing orbs.
   const len=1+Math.min(2.6,Math.abs(vx)/55);
   ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.atan2(vy,vx)+Math.PI/2);
   ctx.shadowColor='#d5efff';ctx.shadowBlur=2.5;ctx.fillStyle='#f7fbff';ctx.beginPath();ctx.ellipse(0,0,f.radius*.72,f.radius*len,0,0,Math.PI*2);ctx.fill();ctx.restore();
  }else{
   ctx.fillStyle=f.depth<.28?'#dcebf5':'#f5fbff';ctx.beginPath();ctx.arc(f.x,f.y,f.radius,0,Math.PI*2);ctx.fill();
  }
 }
 ctx.globalAlpha=1;ctx.shadowBlur=0;raf=requestAnimationFrame(draw);
}
function start(){
 cancelAnimationFrame(raf);ctx.clearRect(0,0,w,h);
 if(!motion.matches&&!document.hidden){last=0;raf=requestAnimationFrame(draw);}
}
let resizeTimer;
addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{resize();start();},120);},{passive:true});
motion.addEventListener('change',start);
document.addEventListener('visibilitychange',start);
resize();start();
})();
const entrance=document.getElementById('entrance');
function dismissEntrance(){entrance.classList.add('dismissed');entrance.addEventListener('transitionend',()=>entrance.remove(),{once:true});}
entrance.addEventListener('click',()=>{tryPlay();dismissEntrance();});

const holidayAudio=document.getElementById('holiday-audio');
const musicToggle=document.getElementById('music-toggle');
const musicNotice=document.getElementById('music-notice');
holidayAudio.volume=.6;
function updateMusic(){
 const playing=!holidayAudio.paused;
 musicToggle.textContent=playing?'❚❚':'▶';
 musicToggle.setAttribute('aria-label',playing?'Pause music':'Play music');
 if(playing)musicNotice.hidden=true;
}
async function tryPlay(){try{await holidayAudio.play();musicNotice.hidden=true;}catch(e){musicNotice.hidden=false;}updateMusic();}
musicToggle.addEventListener('click',()=>{if(holidayAudio.paused)tryPlay();else holidayAudio.pause();});
['play','pause','timeupdate','loadedmetadata','ended'].forEach(name=>holidayAudio.addEventListener(name,updateMusic));
// Music starts only when the visitor taps Enter or Play.
const backgroundVideo=document.querySelector('.background-video');
if(matchMedia('(prefers-reduced-motion: reduce)').matches)backgroundVideo.pause();
</script>
</body></html>
