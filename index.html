<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan.</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#080808;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* Background Glow */
body::before{
    content:'';
    position:absolute;
    width:700px;
    height:700px;
    background:#00ff6630;
    filter:blur(180px);
    border-radius:50%;
    animation:pulse 5s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.15);}
}

/* Card */
.profile{
    width:420px;
    background:rgba(15,15,15,.85);
    backdrop-filter:blur(18px);
    border:1px solid rgba(0,255,102,.15);
    border-radius:25px;
    overflow:hidden;
    box-shadow:
        0 0 40px rgba(0,255,102,.15),
        inset 0 0 30px rgba(0,255,102,.05);
}

/* Banner */
.banner{
    height:140px;
    background:
    linear-gradient(
        135deg,
        #00ff66 0%,
        #00aa44 50%,
        #0f0f0f 100%
    );
}

/* Avatar Container */
.avatar-wrapper{
    position:relative;
    width:150px;
    height:150px;
    margin:-75px auto 15px;
}

/* Animated Border */
.avatar-border{
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background:conic-gradient(
        #00ff66,
        #00cc55,
        #00ff66,
        #00cc55,
        #00ff66
    );
    animation:spin 4s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* Avatar */
.avatar{
    position:absolute;
    inset:4px;
    border-radius:50%;
    overflow:hidden;
    background:#111;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Online Dot */
.status{
    position:absolute;
    right:12px;
    bottom:12px;
    width:24px;
    height:24px;
    background:#00ff66;
    border:4px solid #111;
    border-radius:50%;
    box-shadow:0 0 15px #00ff66;
}

/* Content */
.content{
    text-align:center;
    padding:0 30px 30px;
}

h1{
    font-size:30px;
    margin-bottom:6px;
}

.tag{
    color:#00ff66;
    font-size:13px;
    margin-bottom:12px;
}

.bio{
    color:#b5b5b5;
    line-height:1.5;
    margin-bottom:25px;
}

/* Buttons */
.links{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.links a{
    text-decoration:none;
    color:white;
    background:#121212;
    border:1px solid #202020;
    padding:14px;
    border-radius:12px;
    transition:.25s;
}

.links a:hover{
    transform:translateY(-3px);
    border-color:#00ff66;
    box-shadow:0 0 18px rgba(0,255,102,.35);
}

/* Footer */
.footer{
    margin-top:20px;
    font-size:12px;
    color:#666;
}
</style>
</head>
<body>

<div class="profile">

    <div class="banner"></div>

    <div class="avatar-wrapper">

        <div class="avatar-border"></div>

        <div class="avatar">
            <img src="https://i.im.ge/QMiP57x/discord_fake_avatar_decorations_1780377375443.gif" alt="Avatar">
        </div>

        <div class="status"></div>

    </div>

    <div class="content">

        <h1>slowspan.</h1>

        <div class="tag">● ONLINE</div>

        <p class="bio">
            welcome to my profile
        </p>

        <div class="links">
            <a href="#">Discord</a>
            <a href="#">GitHub</a>
            <a href="#">TikTok</a>
            <a href="#">YouTube</a>
        </div>

        <div class="footer">
            1,337 profile views
        </div>

    </div>

</div>

</body>
</html>
