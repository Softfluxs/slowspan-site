<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: radial-gradient(circle at center,
        #0a0a0a,
        #000000);
}

/* MAIN CARD (guns.lo vibe) */
.card {
    position: relative;
    padding: 32px;
    border-radius: 18px;

    background: rgba(10,10,10,0.75);

    border: 1px solid rgba(57,255,20,0.6);

    box-shadow:
        0 0 15px rgba(57,255,20,0.25),
        0 0 35px rgba(57,255,20,0.15);

    backdrop-filter: blur(12px);
}

/* animated neon aura */
.card::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    background: conic-gradient(
        rgba(57,255,20,0.0),
        rgba(57,255,20,0.8),
        rgba(57,255,20,0.0)
    );
    animation: spin 4s linear infinite;
    z-index: -1;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* avatar wrapper */
.avatar-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    margin: auto;
}

/* avatar */
.avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    position: relative;
    z-index: 2;
}

/* gif decoration */
.deco {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 170%;
    height: 170%;
    transform: translate(-50%, -50%);
    z-index: 3;
    pointer-events: none;
}

/* status dot */
.dot {
    position: absolute;
    bottom: 6px;
    right: 6px;

    width: 12px;
    height: 12px;

    background: #8a8a8a;
    border-radius: 50%;

    border: 2px solid #000;
    z-index: 4;
}

/* name */
.name {
    margin-top: 12px;
    text-align: center;
    font-size: 20px;
    color: white;
    font-weight: bold;
    letter-spacing: 1px;
}

/* discord */
.tag {
    display: block;
    text-align: center;
    margin-top: 6px;
    font-size: 13px;
    color: #aaa;
    text-decoration: none;
}

.tag:hover {
    color: #39ff14;
}
</style>
</head>

<body>

<div class="card">

    <div class="avatar-wrap">

        <!-- avatar -->
        <img class="avatar"
             src="https://cdn.corenexis.com/files/c/5249473720.jpg">

        <!-- decoration -->
        <img class="deco"
             src="https://cdn.corenexis.com/files/c/3497428720.gif">

        <!-- status -->
        <div class="dot"></div>

    </div>

    <div class="name">slowspan</div>

    <a class="tag"
       href="https://discord.com/users/slowspan."
       target="_blank">
       slowspan.
    </a>

</div>

</body>
</html>
