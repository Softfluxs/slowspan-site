<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan.</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#080808;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* Background Glow */
body::before{
    content:'';
    position:absolute;
    width:700px;
    height:700px;
    background:#00ff6620;
    filter:blur(180px);
    border-radius:50%;
    animation:pulse 5s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.15);
    }
}

/* Profile Card */
.profile{
    width:420px;
    background:rgba(15,15,15,.85);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.05);
    border-radius:25px;
    overflow:hidden;
    box-shadow:
        0 0 40px rgba(0,0,0,.5),
        inset 0 0 20px rgba(255,255,255,.02);
}

/* Banner */
.banner{
    height:140px;
    background:
    linear-gradient(
        135deg,
        #1a1a1a,
        #111,
        #0a0a0a
    );
}

/* Avatar */
.avatar-wrapper{
    position:relative;
    width:150px;
    height:150px;
    margin:-75px auto 15px;
}

.avatar{
    width:150px;
    height:150px;
    border-radius:50%;
    overflow:hidden;
    background:#111;
    box-shadow:
        0 0 25px rgba(255,255,255,.08);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* Red Status Dot */
.status{
    position:absolute;
    right:4px;
    bottom:4px;
    width:18px;
    height:18px;
    background:#ff2b2b;
    border:3px solid #111;
    border-radius:50%;
    box-shadow:0 0 12px rgba(255,43,43,.8);
}

/* Content */
.content{
    text-align:center;
    padding:0 30px 30px;
}

h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:6px;
}

.tag{
    color:#ff2b2b;
    font-size:13px;
    margin-bottom:15px;
}

.bio{
    color:#b5b5b5;
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;
}

/* Links */
.links{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.links a{
    text-decoration:none;
    color:white;
    background:#111;
    border:1px solid #1d1d1d;
    padding:14px;
    border-radius:12px;
    transition:.25s;
}

.links a:hover{
    transform:translateY(-3px);
    border-color:#444;
    background:#151515;
}

/* Footer */
.footer{
    margin-top:20px;
    color:#666;
    font-size:12px;
}
</style>
</head>
<body>

<div class="profile">

    <div class="banner"></div>

    <div class="avatar-wrapper">

        <div class="avatar">
            <img src="https://i.im.ge/QMiP57x/discord_fake_avatar_decorations_1780377375443.gif" alt="Avatar">
        </div>

        <div class="status"></div>

    </div>

    <div class="content">

        <h1>slowspan.</h1>

        <div class="tag">● OFFLINE</div>

        <p class="bio">
            welcome to my profile.
        </p>

        <div class="links">
            <a href="#">Discord</a>
            <a href="#">GitHub</a>
            <a href="#">TikTok</a>
            <a href="#">YouTube</a>
        </div>

        <div class="footer">
            1,337 profile views
        </div>

    </div>

</div>

</body>
</html>
