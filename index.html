<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: radial-gradient(circle at center,
        #0f1f0f 0%,
        #0a0a0a 40%,
        #050505 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* CARD */
.profile-card {
    position: relative;
    overflow: hidden;

    background: rgba(18, 18, 18, 0.85);
    border: 1px solid rgba(57, 255, 20, 0.45);
    border-radius: 24px;

    width: 100%;
    max-width: 380px;
    padding: 30px;

    backdrop-filter: blur(12px);

    animation: greenGlow 2.5s ease-in-out infinite alternate;
}

/* aura */
.profile-card::before {
    content: "";
    position: absolute;
    inset: -200%;
    background: conic-gradient(
        transparent,
        rgba(57,255,20,.9),
        transparent,
        transparent
    );
    animation: rotateAura 5s linear infinite;
    z-index: -2;
}

.profile-card::after {
    content: "";
    position: absolute;
    inset: 2px;
    background: rgba(18,18,18,.96);
    border-radius: 22px;
    z-index: -1;
}

/* center */
.identity-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

/* avatar */
.avatar-container {
    position: relative;
    width: 110px;
    height: 110px;
}

/* YOUR NEW AVATAR */
.avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
}

/* decoration overlay */
.avatar-decoration {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 155%;
    height: 155%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
}

/* status dot */
.status-dot {
    position: absolute;
    bottom: 4px;
    right: 4px;

    width: 14px;
    height: 14px;

    background: #8a8a8a;
    border-radius: 50%;
    border: 2px solid #121212;
}

/* name */
.display-name {
    font-size: 20px;
    font-weight: 700;
    color: white;
}

/* discord link */
.discord-link {
    font-size: 14px;
    color: #aaa;
    text-decoration: none;
}

.discord-link:hover {
    color: #39ff14;
}

/* animations */
@keyframes greenGlow {
    0% {
        box-shadow:
            0 0 10px rgba(57,255,20,.2),
            0 0 20px rgba(57,255,20,.1);
    }
    100% {
        box-shadow:
            0 0 25px rgba(57,255,20,.5),
            0 0 50px rgba(57,255,20,.25);
    }
}

@keyframes rotateAura {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="profile-card">

    <div class="identity-section">

        <div class="avatar-container">

            <!-- UPDATED AVATAR -->
            <img src="https://cdn.corenexis.com/files/c/5249473720.jpg"
                 class="avatar"
                 alt="avatar">

            <!-- KEEP DECORATION (unchanged) -->
            <img src="https://i.im.ge/QMi7zAp/discord_fake_avatar_decorations_1780347050541.gif"
                 class="avatar-decoration"
                 alt="avatar decoration">

            <!-- STATUS DOT -->
            <div class="status-dot"></div>

        </div>

        <div class="display-name">slowspan</div>

        <a class="discord-link"
           href="https://discord.com/users/slowspan."
           target="_blank"
           rel="noopener noreferrer">
           slowspan.
        </a>

    </div>

</div>

</body>
</html>
