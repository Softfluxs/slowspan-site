<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* =========================
   CINEMATIC BACKGROUND
========================= */
.bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;

    /* enhancement */
    filter:brightness(0.55) contrast(1.2) saturate(1.1);
    transform:scale(1.05); /* slight zoom for cinematic feel */
}

/* dark overlay for readability */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:radial-gradient(circle at center, rgba(0,0,0,0.35), rgba(0,0,0,0.75));
    z-index:-2;
}

/* =========================
   PAGE
========================= */
body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* =========================
   PROFILE CARD
========================= */
.profile{
    width:420px;
    background:rgba(15,15,15,.72);
    backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    box-shadow:0 0 50px rgba(0,0,0,.65);
    overflow:hidden;
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

/* =========================
   AVATAR
========================= */
.avatar-wrapper{
    width:165px;
    height:165px;
    margin:25px auto 10px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.avatar{
    width:165px;
    height:165px;
    object-fit:contain;
    filter:drop-shadow(0 0 18px rgba(255,255,255,.18));
    border-radius:18px;
}

/* =========================
   CONTENT
========================= */
.content{
    text-align:center;
    padding:10px 25px 35px;
}

h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:8px;
}

/* username */
.username{
    display:inline-block;
    font-size:16px;
    color:#ff3b3b;
    text-decoration:none;
    margin-bottom:14px;
    transition:0.2s;
    font-weight:500;
}

.username:hover{
    text-shadow:0 0 12px rgba(255,59,59,.8);
    transform:scale(1.03);
}

/* bio */
.bio{
    font-size:14px;
    color:#b5b5b5;
    line-height:1.6;
}
</style>
</head>

<body>

<!-- BACKGROUND IMAGE (CINEMATIC) -->
<img class="bg"
src="https://i.im.ge/QMitCuW/9c14863b9e64ffc65cdfda4cdc9a0b99_1.gif"
alt="background">

<div class="overlay"></div>

<!-- PROFILE -->
<div class="profile">

    <!-- AVATAR -->
    <div class="avatar-wrapper">
        <img class="avatar"
        src="https://i.im.ge/QMitJ4X/discord_fake_avatar_decorations_1780383216399.gif"
        alt="avatar">
    </div>

    <div class="content">

        <h1>slowspan</h1>

        <a class="username"
           href="https://discord.com/users/YOUR_ID_HERE"
           target="_blank">
            @slowspan.
        </a>

        <p class="bio">
            welcome to my profile.
        </p>

    </div>

</div>

</body>
</html>
