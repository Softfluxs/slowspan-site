<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#000;
    overflow:hidden;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* BACKGROUND */
.bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    filter:brightness(0.55);
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:-1;
}

/* ENTER SCREEN */
.enter{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(18px);
    z-index:999;
}

.enter span{
    font-size:140px;
    font-weight:800;
    cursor:pointer;
    animation:pulse 2.5s infinite;
}

@keyframes pulse{
    0%{transform:scale(1); opacity:0.7;}
    50%{transform:scale(1.08); opacity:1;}
    100%{transform:scale(1); opacity:0.7;}
}

/* PROFILE */
.profile{
    width:420px;
    background:rgba(15,15,15,0.72);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    backdrop-filter:blur(20px);
    overflow:hidden;

    opacity:0;
    transform:translateY(20px);
    transition:0.8s ease;
}

.profile.show{
    opacity:1;
    transform:translateY(0);
    box-shadow:0 0 40px rgba(150,150,150,0.15);
}

/* BANNER */
.banner img{
    width:100%;
    height:140px;
    object-fit:cover;
}

/* MUSIC */
.music{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:12px;
    padding:10px 12px;
    border-radius:14px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
}

.music .title{
    font-size:13px;
    font-weight:600;
}

.music .sub{
    font-size:11px;
    opacity:0.7;
}

.music button{
    width:34px;
    height:34px;
    border-radius:10px;
    border:none;
    background:rgba(0,0,0,0.3);
    color:white;
    cursor:pointer;
    transition:0.2s ease;
}

.music button:hover{
    transform:scale(1.1);
}

/* AVATAR */
.avatar-wrap{
    display:flex;
    justify-content:center;
    margin:10px 0;
}

.avatar-wrap img{
    width:165px;
    height:165px;
    object-fit:contain;
    border-radius:0;
}

/* TITLE */
.name{
    text-align:center;
    font-size:30px;
    font-weight:700;
    margin-top:5px;
}

.name span{
    display:inline-block;
    animation:fade 2.5s infinite;
}

@keyframes fade{
    0%{opacity:0; transform:translateY(10px);}
    20%{opacity:1;}
    100%{opacity:0; transform:translateY(-10px);}
}

/* SOCIALS */
.socials{
    display:flex;
    justify-content:center;
    gap:18px;
    margin:15px 0 30px;
}

.socials a{
    font-size:34px;
    color:white;
    display:inline-block;
    transition:0.25s ease;
}

.socials a:hover{
    transform:scale(1.3);
}

/* COLORS */
.fa-spotify:hover{color:#1DB954;}
.fa-steam:hover{color:#00ADEE;}
.fa-playstation:hover{color:#ffffff;}
</style>
</head>

<body>

<img class="bg" src="https://i.im.ge/QMitCuW/9c14863b9e64ffc65cdfda4cdc9a0b99_1.gif">
<div class="overlay"></div>

<audio id="music" loop>
<source src="https://videotourl.com/audio/1780387263434-fd66ba40-2bfa-4b32-afc5-a312db49cb96.mp3">
</audio>

<!-- ENTER -->
<div class="enter" onclick="start()">
    <span>S</span>
</div>

<!-- PROFILE -->
<div class="profile" id="profile">

    <div class="banner">
        <img src="https://i.im.ge/QMiy7oT/24baee95217b413d6a9512f0309831b8_1.gif">
    </div>

    <div class="music">
        <div>
            <div class="title">See You Again</div>
            <div class="sub">Tyler The Creator</div>
        </div>
        <button id="btn" onclick="toggle()">▶</button>
    </div>

    <div class="avatar-wrap">
        <img src="https://i.im.ge/QMiyfHf/discord_fake_avatar_decorations_1780383216399.gif">
    </div>

    <div class="name" id="name"></div>

    <div class="socials">
        <a href="https://open.spotify.com/user/312ygzuq5botjx3u6sfcck5lm7r4" target="_blank">
            <i class="fa-brands fa-spotify"></i>
        </a>

        <a href="https://steamcommunity.com/profiles/76561198728733895" target="_blank">
            <i class="fa-brands fa-steam"></i>
        </a>

        <a href="https://profile.playstation.com/Slowspan" target="_blank">
            <i class="fa-brands fa-playstation"></i>
        </a>
    </div>

</div>

<script>
const music = document.getElementById("music");
const profile = document.getElementById("profile");
const btn = document.getElementById("btn");

/* ENTER + AUTOPLAY MUSIC */
function start(){
    document.querySelector(".enter").style.display="none";
    profile.classList.add("show");

    music.play().then(() => {
        btn.innerText = "❚❚";
    }).catch(err => {
        console.log("Autoplay blocked:", err);
    });
}

/* MUSIC TOGGLE */
function toggle(){
    if(music.paused){
        music.play();
        btn.innerText="❚❚";
    } else {
        music.pause();
        btn.innerText="▶";
    }
}

/* NAME ANIMATION */
const text="slowspan";
const name=document.getElementById("name");

[...text].forEach((c,i)=>{
    let s=document.createElement("span");
    s.textContent=c;
    s.style.animationDelay=(i*0.1)+"s";
    name.appendChild(s);
});
</script>

</body>
</html>
