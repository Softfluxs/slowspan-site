<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan.</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#0a0a0a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#00ff6a22;
    filter:blur(120px);
    border-radius:50%;
}

.card{
    position:relative;
    width:380px;
    background:rgba(15,15,15,.85);
    backdrop-filter:blur(10px);
    border:1px solid rgba(0,255,106,.2);
    border-radius:24px;
    padding:35px;
    text-align:center;
    box-shadow:
    0 0 30px rgba(0,255,106,.15),
    inset 0 0 20px rgba(0,255,106,.05);
}

.avatar{
    width:140px;
    height:140px;
    margin:auto;
    border-radius:50%;
    padding:4px;
    background:#00ff6a;
    box-shadow:
    0 0 20px #00ff6a,
    0 0 40px #00ff6a55;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
}

h1{
    margin-top:18px;
    font-size:28px;
    font-weight:700;
}

.bio{
    margin-top:8px;
    color:#aaa;
    font-size:14px;
}

.divider{
    width:100%;
    height:1px;
    background:#1e1e1e;
    margin:25px 0;
}

.socials{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.socials a{
    text-decoration:none;
    color:white;
    background:#111;
    border:1px solid #1f1f1f;
    padding:14px;
    border-radius:12px;
    transition:.25s;
}

.socials a:hover{
    border-color:#00ff6a;
    transform:translateY(-2px);
    box-shadow:0 0 15px rgba(0,255,106,.3);
}

.views{
    margin-top:20px;
    color:#666;
    font-size:12px;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:6px 12px;
    border-radius:999px;
    background:#00ff6a22;
    border:1px solid #00ff6a55;
    color:#00ff6a;
    font-size:12px;
}
</style>
</head>
<body>

<div class="card">

    <div class="avatar">
        <!-- Put your uploaded image here -->
        <img src="avatar.gif" alt="Avatar">
    </div>

    <h1>slowspan.</h1>

    <div class="badge">ONLINE</div>

    <p class="bio">
        guns.lol inspired profile
    </p>

    <div class="divider"></div>

    <div class="socials">
        <a href="#">Discord</a>
        <a href="#">GitHub</a>
        <a href="#">TikTok</a>
        <a href="#">YouTube</a>
    </div>

    <div class="views">
        1,337 profile views
    </div>

</div>

</body>
</html>
