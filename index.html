<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan.</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#080808;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

body::before{
    content:'';
    position:absolute;
    width:700px;
    height:700px;
    background:rgba(0,255,100,.12);
    filter:blur(180px);
    border-radius:50%;
    animation:pulse 6s ease-in-out infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.15);}
}

.profile{
    width:420px;
    background:rgba(15,15,15,.85);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.05);
    border-radius:24px;
    overflow:visible;
    box-shadow:
        0 0 40px rgba(0,0,0,.5),
        inset 0 0 20px rgba(255,255,255,.02);
}

.banner{
    height:140px;
    background:linear-gradient(
        135deg,
        #181818,
        #101010,
        #080808
    );
    border-radius:24px 24px 0 0;
}

.avatar-wrapper{
    position:relative;
    width:180px;
    height:180px;
    margin:-95px auto 15px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.avatar{
    width:180px;
    height:180px;
    object-fit:contain;
    filter:drop-shadow(0 0 15px rgba(255,255,255,.15));
    user-select:none;
}

.status{
    position:absolute;
    right:22px;
    bottom:22px;
    width:18px;
    height:18px;
    background:#ff2b2b;
    border:2px solid #111;
    border-radius:50%;
    box-shadow:0 0 10px rgba(255,43,43,.9);
}

.content{
    text-align:center;
    padding:0 30px 30px;
}

h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:6px;
}

.tag{
    color:#ff2b2b;
    font-size:13px;
    margin-bottom:15px;
}

.bio{
    color:#b5b5b5;
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.links a{
    text-decoration:none;
    color:white;
    background:#111;
    border:1px solid #1d1d1d;
    padding:14px;
    border-radius:12px;
    transition:.25s;
}

.links a:hover{
    transform:translateY(-3px);
    background:#151515;
    border-color:#333;
}
</style>
</head>
<body>

<div class="profile">

    <div class="banner"></div>

    <div class="avatar-wrapper">

        <img
            class="avatar"
            src="https://i.im.ge/QMiP57x/discord_fake_avatar_decorations_1780377375443.gif"
            alt="Avatar">

        <div class="status"></div>

    </div>

    <div class="content">

        <h1>slowspan.</h1>

        <div class="tag">● OFFLINE</div>

        <p class="bio">
            welcome to my profile.
        </p>

        <div class="links">
            <a href="#">Discord</a>
        </div>

    </div>

</div>

</body>
</html>
