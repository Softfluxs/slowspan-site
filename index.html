
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slowspan. Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Profile Card Container */
        .profile-card {
            background-color: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Music Section */
        .music-player {
            background-color: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .music-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .song-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        .song-artist {
            font-size: 12px;
            color: #8e8e93;
        }

        .play-button {
            width: 36px;
            height: 36px;
            background-color: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .play-button:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* Identity Section */
        .identity-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 10px;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: block;
        }

        /* Status indicator (dot) */
        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            background-color: #ff3b30;
            border: 2.5px solid #121212;
            border-radius: 50%;
            z-index: 2;
        }

        .username {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .discord-tag {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 4px;
        }

        /* Activity Section */
        .activity-card {
            background-color: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .activity-icon {
            width: 32px;
            height: 32px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .activity-text {
            font-size: 14px;
            font-weight: 500;
            color: #e5e5ea;
        }

        /* Divider Line */
        .divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.06);
            width: 100%;
            margin: 5px 0;
        }

        /* Social Icons Row */
        .socials-row {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
        }

        .social-button {
            width: 44px;
            height: 44px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            color: #aeaeacf2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        
        <div class="music-player">
            <div class="music-info">
                <span class="song-title">Runaway</span>
                <span class="song-artist">Kanye West</span>
            </div>
            <button class="play-button" aria-label="Play">
                <i class="fas fa-play" style="font-size: 12px; margin-left: 2px;"></i>
            </button>
        </div>

        <div class="identity-section">
            <div class="avatar-container">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Avatar" class="avatar">
                <div class="status-dot"></div>
            </div>
            <h1 class="username">slowspan.</h1>
            <span class="discord-tag">@slowspan.</span>
        </div>

        <div class="activity-card">
            <div class="activity-icon">
                <i class="fas fa-gamepad"></i>
            </div>
            <div class="activity-text">
                Playing SiegeX with Medal
            </div>
        </div>

        <div class="divider"></div>

        <div class="socials-row">
            <a href="https://github.com" target="_blank" class="social-button" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://youtube.com" target="_blank" class="social-button" aria-label="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="#" class="social-button" aria-label="Custom Platform">
                <i class="fas fa-shield-halved"></i>
            </a>
        </div>

    </div>

</body>
</html>
