<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* VIDEO BACKGROUND */
.bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.45) contrast(1.1);
}

/* DARK OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* PAGE */
body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* CARD */
.profile{
    width:420px;
    background:rgba(15,15,15,.85);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.05);
    border-radius:24px;
    overflow:visible;
    box-shadow:
        0 0 40px rgba(0,0,0,.6),
        inset 0 0 20px rgba(255,255,255,.02);
}

/* BANNER */
.banner{
    height:140px;
    background:rgba(255,255,255,0.03);
    border-radius:24px 24px 0 0;
}

/* AVATAR */
.avatar-wrapper{
    position:relative;
    width:180px;
    height:180px;
    margin:-95px auto 15px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.avatar{
    width:180px;
    height:180px;
    object-fit:contain;
    filter:drop-shadow(0 0 15px rgba(255,255,255,.15));
    user-select:none;
}

/* CONTENT */
.content{
    text-align:center;
    padding:0 30px 30px;
}

/* DISPLAY NAME */
h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:8px;
}

/* CLICKABLE USERNAME */
.username{
    display:inline-block;
    margin-bottom:15px;
    font-size:16px;   /* slightly bigger */
    color:#ff2b2b;
    text-decoration:none;
    transition:.2s;
}

.username:hover{
    text-shadow:0 0 10px rgba(255,43,43,.8);
}

/* BIO */
.bio{
    color:#b5b5b5;
    font-size:14px;
    line-height:1.6;
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video class="bg-video" autoplay muted loop playsinline>
    <source src="canyons.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="profile">

    <div class="banner"></div>

    <div class="avatar-wrapper">

        <img class="avatar"
        src="https://i.im.ge/QMiP57x/discord_fake_avatar_decorations_1780377375443.gif"
        alt="avatar">

    </div>

    <div class="content">

        <!-- DISPLAY NAME -->
        <h1>slowspan</h1>

        <!-- CLICKABLE RED @USERNAME -->
        <a class="username"
           href="https://discord.com/users/YOUR_ID_HERE"
           target="_blank">
            @slowspan.
        </a>

        <p class="bio">
            welcome to my profile.
        </p>

    </div>

</div>

</body>
</html>
