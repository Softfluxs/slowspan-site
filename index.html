<!DOCTYPE html>
<html>
<head>
  <title>slowspan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #000000, #111111);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      padding: 30px;
      border: 1px solid #333;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      width: 280px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
    }
    p {
      color: #aaa;
      margin-bottom: 20px;
    }
    a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 10px;
      transition: 0.2s;
    }
    a:hover {
      background: white;
      color: black;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>@slowspan</h1>
    <p>links page</p>

    <a href="https://discord.com">Discord</a>
    <a href="https://github.com">GitHub</a>
    <a href="https://instagram.com">Instagram</a>
  </div>
</body>
</html>
