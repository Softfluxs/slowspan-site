<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slowspan. Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        body {
    background: radial-gradient(circle at center,
        #0f1f0f 0%,
        #0a0a0a 40%,
        #050505 100%);
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    overflow: hidden;
}

/* Animated Profile Card */
.profile-card {
    position: relative;
    overflow: hidden;

    background-color: rgba(18, 18, 18, 0.85);
    border: 1px solid rgba(57, 255, 20, 0.45);
    border-radius: 24px;
    width: 100%;
    max-width: 420px;
    padding: 24px;

    backdrop-filter: blur(12px);

    display: flex;
    flex-direction: column;
    gap: 20px;

    animation:
        greenGlow 2.5s ease-in-out infinite alternate,
        floatCard 6s ease-in-out infinite;

    transition: all 0.3s ease;
}

.profile-card:hover {
    transform: translateY(-8px) scale(1.01);
}

/* Rotating neon border */
.profile-card::before {
    content: "";
    position: absolute;
    inset: -200%;
    background: conic-gradient(
        transparent,
        rgba(57,255,20,.9),
        transparent,
        transparent,
        transparent
    );
    animation: rotateAura 5s linear infinite;
    z-index: -2;
}

/* Dark inner panel */
.profile-card::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: 22px;
    background: rgba(18,18,18,.96);
    z-index: -1;
}

.avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;

    border: 2px solid rgba(255, 255, 255, 0.1);

    box-shadow: none;
    animation: none;

}

/* Pulsing status */
.status-dot {
    position: absolute;
    bottom: 4px;
    right: 4px;

    width: 14px;
    height: 14px;

    background: #39ff14;
    border: 2.5px solid #121212;
    border-radius: 50%;

    animation: statusPulse 1.5s infinite;
}

/* Social buttons glow */
.social-button {
    width: 44px;
    height: 44px;

    background-color: rgba(255,255,255,.05);
    border: 1px solid rgba(57,255,20,.2);

    border-radius: 10px;
    color: #aeaeacf2;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 18px;
    text-decoration: none;

    transition: all .25s ease;
}

.social-button:hover {
    color: #39ff14;

    border-color: #39ff14;

    box-shadow:
        0 0 10px rgba(57,255,20,.5),
        0 0 20px rgba(57,255,20,.3);

    transform: translateY(-3px);
}

/* Music player glow */
.music-player,
.activity-card {
    transition: .3s ease;
}

.music-player:hover,
.activity-card:hover {
    border-color: rgba(57,255,20,.4);

    box-shadow:
        0 0 10px rgba(57,255,20,.15);
}

/* Username glow */
.username {
    font-size: 24px;
    font-weight: 700;
    color: white;

    text-shadow:
        0 0 10px rgba(57,255,20,.3);
}

/* Animations */

@keyframes greenGlow {
    0% {
        box-shadow:
            0 0 10px rgba(57,255,20,.25),
            0 0 20px rgba(57,255,20,.15),
            0 0 40px rgba(57,255,20,.08);
    }

    100% {
        box-shadow:
            0 0 25px rgba(57,255,20,.8),
            0 0 50px rgba(57,255,20,.45),
            0 0 90px rgba(57,255,20,.2);
    }
}

@keyframes rotateAura {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

@keyframes floatCard {
    0% {
        transform: translateY(0px);
    }

    50% {
        transform: translateY(-6px);
    }

    100% {
        transform: translateY(0px);
    }
}

@keyframes avatarGlow {
    from {
        box-shadow:
            0 0 10px rgba(57,255,20,.3),
            0 0 20px rgba(57,255,20,.15);
    }

    to {
        box-shadow:
            0 0 20px rgba(57,255,20,.8),
            0 0 45px rgba(57,255,20,.4);
    }
}

@keyframes statusPulse {
    0% {
        box-shadow: 0 0 0 0 rgba(57,255,20,.7);
    }

    70% {
        box-shadow: 0 0 0 10px rgba(57,255,20,0);
    }

    100% {
        box-shadow: 0 0 0 0 rgba(57,255,20,0);
    }
    
        }

        /* Top Music Section */
        .music-player {
            background-color: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .music-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .song-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        .song-artist {
            font-size: 12px;
            color: #8e8e93;
        }

        .play-button {
            width: 36px;
            height: 36px;
            background-color: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .play-button:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* Identity Section */
        .identity-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 10px;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: block;
        }

        /* Status indicator (dot) */
        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            background-color: #ff3b30;
            border: 2.5px solid #121212;
            border-radius: 50%;
            z-index: 2;
        }

        .username {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        /* Discord Handle Link Style */
        .discord-tag-link {
            text-decoration: none;
            margin-top: 4px;
            display: inline-block;
            transition: opacity 0.2s ease;
        }

        .discord-tag-link:hover {
            opacity: 0.75;
        }

        .discord-tag {
            font-size: 14px;
            color: #8e8e93;
        }

        /* Activity Section */
        .activity-card {
            background-color: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .activity-icon {
            width: 32px;
            height: 32px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }

        .activity-text {
            font-size: 14px;
            font-weight: 500;
            color: #e5e5ea;
        }

        /* Divider Line */
        .divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.06);
            width: 100%;
            margin: 5px 0;
        }

        /* Social Icons Row */
        .socials-row {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
        }

        .social-button {
            width: 44px;
            height: 44px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            color: #aeaeacf2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>

        <div class="music-player">

            </button>

        <div class="identity-section">
            <div class="avatar-container">
                <img src="https://i.im.ge/QMiaj9Y/1000024403.jpg" alt="Avatar" class="avatar">

            <a href="https://discord.com/users/slowspan." target="_blank" class="discord-tag-link">

        <div class="activity-card">

        </div>

    </div>

</body>
</html>
