<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slowspan</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* BACKGROUND */
.bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.55) contrast(1.15) saturate(1.1);
    transform:scale(1.05);
}

/* OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* PAGE */
body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

/* PROFILE CARD */
.profile{
    width:420px;
    background:rgba(15,15,15,.72);
    backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    box-shadow:0 0 50px rgba(0,0,0,.65);
    overflow:hidden;
}

/* BANNER */
.banner img{
    width:100%;
    height:140px;
    object-fit:cover;
    display:block;
}

/* AVATAR WRAPPER */
.avatar-wrapper{
    width:165px;
    height:165px;
    margin:25px auto 10px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* AVATAR */
.avatar{
    width:165px;
    height:165px;
    object-fit:contain;
    border-radius:0;
    border:none;
    box-shadow:none;
    background:transparent;
}

/* DISCORD OFFLINE DOT */
.status-dot{
    position:absolute;
    bottom:10px;
    right:10px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#747f8d;
    border:3px solid #111;
}

/* CLICK ENTER SCREEN */
.enter-screen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.92);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
    cursor:pointer;
}

.enter-box{
    padding:14px 28px;
    border:1px solid rgba(255,255,255,0.2);
    font-size:18px;
    color:white;
    transition:0.2s;
}

.enter-box:hover{
    transform:scale(1.05);
    border-color:white;
}

/* CONTENT */
.content{
    text-align:center;
    padding:10px 25px 35px;
}

h1{
    font-size:30px;
    font-weight:700;
    margin-bottom:8px;
}

/* USERNAME */
.username{
    display:inline-block;
    font-size:16px;
    color:#ff3b3b;
    text-decoration:none;
    margin-bottom:12px;
    transition:0.2s;
}

.username:hover{
    transform:scale(1.05);
    text-shadow:0 0 12px rgba(255,59,59,.8);
}

/* ICONS */
.socials{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:12px;
}

.socials a{
    font-size:34px;
    color:white;
    opacity:0.85;
    transition:0.2s;
}

.socials a:hover{
    transform:scale(1.2);
    opacity:1;
}

.fa-steam:hover{ color:#66c0f4; }
.fa-playstation:hover{ color:#0070d1; }
.fa-spotify:hover{ color:#1db954; }
</style>
</head>

<body>

<!-- BACKGROUND -->
<img class="bg" src="https://i.im.ge/QMitCuW/9c14863b9e64ffc65cdfda4cdc9a0b99_1.gif">
<div class="overlay"></div>

<!-- AUDIO -->
<audio id="bg-audio" src="https://videotourl.com/audio/1780387263434-fd66ba40-2bfa-4b32-afc5-a312db49cb96.mp3"></audio>

<!-- ENTER SCREEN -->
<div class="enter-screen" onclick="startSite()">
    <div class="enter-box">click to enter</div>
</div>

<!-- PROFILE -->
<div class="profile">

    <div class="banner">
        <img src="https://i.im.ge/QMiy7oT/24baee95217b413d6a9512f0309831b8_1.gif">
    </div>

    <div class="avatar-wrapper">
        <img class="avatar"
        src="https://i.im.ge/QMitJ4X/discord_fake_avatar_decorations_1780383216399.gif">

        <!-- OFFLINE DOT -->
        <div class="status-dot"></div>
    </div>

    <div class="content">

        <h1>slowspan</h1>

        <a class="username"
           href="https://discord.com/users/YOUR_ID_HERE"
           target="_blank">
            @slowspan.
        </a>

        <div class="socials">

            <a href="https://open.spotify.com/user/312ygzuq5botjx3u6sfcck5lm7r4" target="_blank">
                <i class="fa-brands fa-spotify"></i>
            </a>

            <a href="https://steamcommunity.com/profiles/76561198728733895" target="_blank">
                <i class="fa-brands fa-steam"></i>
            </a>

            <a href="https://profile.playstation.com/Slowspan" target="_blank">
                <i class="fa-brands fa-playstation"></i>
            </a>

        </div>

    </div>

</div>

<script>
function startSite(){
    const audio = document.getElementById("bg-audio");
    audio.volume = 0.5;
    audio.play();

    document.querySelector(".enter-screen").style.display = "none";
}
</script>

</body>
</html>
